<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Quest - LSA, TSA &amp; Volume</title>
    <style>
        :root {
            --bg: #0b0b18;
            --surface: #141428;
            --surface2: #1c1c36;
            --surface3: #22223e;
            --text: #e4e4f4;
            --text2: #9898b8;
            --accent: #6c5ce7;
            --accent2: #a29bfe;
            --success: #00cec9;
            --danger: #fd79a8;
            --warning: #fdcb6e;
            --radius: 16px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 0;
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(108,92,231,0.10) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(0,206,201,0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 90%, rgba(253,121,168,0.06) 0%, transparent 50%);
        }
        .app-container {
            flex: 1; display: flex; flex-direction: column;
            gap: 16px; padding: 18px 22px 22px; width: 100%;
        }
        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px; padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .header .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; box-shadow: 0 4px 16px rgba(108,92,231,0.4);
        }
        .header h1 {
            font-size: 1.35rem; font-weight: 700; letter-spacing: -0.3px;
            background: linear-gradient(135deg, #e4e4f4, #c0c0e0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .stats-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .stat-pill {
            background: var(--surface2); border-radius: 20px; padding: 7px 13px;
            font-size: 0.82rem; font-weight: 600; display: flex; align-items: center; gap: 6px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .stat-pill.score { color: var(--success); }
        .stat-pill.streak { color: var(--warning); }
        .stat-pill.total { color: var(--text2); }
        /* Main Card - two-column grid */
        .main-card {
            background: var(--surface); border-radius: var(--radius);
            padding: 20px; border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            display: grid; grid-template-columns: 420px 1fr;
            gap: 24px; align-items: start; transition: var(--transition);
        }
        .main-card.correct-flash {
            box-shadow: 0 0 0 3px rgba(0,206,201,0.45), 0 8px 40px rgba(0,0,0,0.4);
            animation: flashGreen 0.6s ease-out;
        }
        .main-card.incorrect-flash {
            box-shadow: 0 0 0 3px rgba(253,121,168,0.45), 0 8px 40px rgba(0,0,0,0.4);
            animation: flashRed 0.6s ease-out;
        }
        @keyframes flashGreen {
            0%,100% { box-shadow: 0 0 0 3px rgba(0,206,201,0.45),0 8px 40px rgba(0,0,0,0.4); }
            50%      { box-shadow: 0 0 0 14px rgba(0,206,201,0),0 8px 40px rgba(0,0,0,0.4); }
        }
        @keyframes flashRed {
            0%,100% { box-shadow: 0 0 0 3px rgba(253,121,168,0.45),0 8px 40px rgba(0,0,0,0.4); }
            50%      { box-shadow: 0 0 0 14px rgba(253,121,168,0),0 8px 40px rgba(0,0,0,0.4); }
        }
        .card-left { display: flex; flex-direction: column; gap: 12px; }
        .card-right { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
        /* Canvas */
        .canvas-wrapper {
            position: relative; width: 100%;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface2); border-radius: 14px; overflow: hidden;
            min-height: 340px; border: 1px solid rgba(255,255,255,0.05);
        }
        canvas { display: block; width: 100%; height: auto; transition: opacity 0.15s ease; }
        .shape-label {
            position: absolute; top: 10px; right: 14px;
            font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.8px; color: var(--text2); opacity: 0.65; pointer-events: none;
        }
        /* Problem Area */
        .problem-area { display: flex; flex-direction: column; gap: 10px; }
        .problem-type-badge {
            display: inline-block; align-self: flex-start;
            padding: 5px 12px; border-radius: 14px;
            font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .badge-lsa { background: rgba(253,203,110,0.18); color: #fdcb6e; }
        .badge-tsa { background: rgba(0,206,201,0.18); color: #00cec9; }
        .badge-volume { background: rgba(162,155,254,0.18); color: #a29bfe; }
        .badge-csa { background: rgba(253,203,110,0.18); color: #fdcb6e; }
        .problem-text { font-size: 1.05rem; font-weight: 500; line-height: 1.6; color: var(--text); }
        .problem-text .dim { font-weight: 700; color: #fff; }
        /* Challenge Note */
        .challenge-note {
            display: none; padding: 9px 14px; border-radius: 10px;
            background: rgba(253,203,110,0.1); border: 1px solid rgba(253,203,110,0.25);
            color: #fdcb6e; font-size: 0.85rem; font-weight: 600;
            animation: fadeIn 0.3s ease;
        }
        .challenge-note.show { display: block; }
        .challenge-note .derive-hint { font-weight: 400; font-size: 0.78rem; color: #ffeaa7; margin-top: 3px; }
        /* Dim Tags */
        .dimensions-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .dim-tag {
            background: var(--surface2); padding: 6px 11px; border-radius: 9px;
            font-size: 0.82rem; font-weight: 500; color: var(--text2);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .dim-tag strong { color: #fff; }
        .dim-tag .dim-name { color: var(--accent2); font-size: 0.74rem; font-weight: 500; }
        /* Input */
        .input-row { display: flex; gap: 10px; align-items: center; }
        .input-row input {
            flex: 1; padding: 12px 16px; border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.1); background: var(--surface2);
            color: #fff; font-size: 1rem; font-weight: 500; outline: none;
            transition: var(--transition); min-width: 0; font-family: inherit;
        }
        .input-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(108,92,231,0.14); }
        .input-row input::placeholder { color: rgba(255,255,255,0.28); }
        .input-helper { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .sym-btn {
            padding: 4px 11px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: var(--surface2); color: var(--accent2);
            font-size: 1rem; cursor: pointer; font-family: inherit;
            transition: var(--transition); font-weight: 600;
        }
        .sym-btn:hover { background: rgba(108,92,231,0.2); border-color: var(--accent); color: #fff; }
        .sym-hint { font-size: 0.70rem; color: var(--text2); opacity: 0.65; margin-left: 2px; }
        /* Buttons */
        .btn {
            padding: 12px 20px; border-radius: 10px; border: none;
            font-weight: 700; font-size: 0.9rem; cursor: pointer; letter-spacing: 0.3px;
            transition: var(--transition); font-family: inherit; white-space: nowrap;
            display: flex; align-items: center; gap: 6px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-submit { background: var(--accent); color: #fff; box-shadow: 0 4px 15px rgba(108,92,231,0.32); }
        .btn-submit:hover { background: #7c6cf0; box-shadow: 0 6px 20px rgba(108,92,231,0.5); transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
        .btn-new { background: var(--surface2); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }
        .btn-new:hover { background: var(--surface3); border-color: rgba(255,255,255,0.2); }
        .btn-hint { background: transparent; color: var(--text2); border: 1px solid rgba(255,255,255,0.08); padding: 10px 14px; font-size: 0.8rem; }
        .btn-hint:hover { color: #fff; border-color: rgba(255,255,255,0.2); }
        /* Feedback */
        .feedback { padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 0.88rem; display: none; animation: fadeIn 0.3s ease; }
        .feedback.show { display: block; }
        .feedback.correct { background: rgba(0,206,201,0.12); color: #00cec9; border: 1px solid rgba(0,206,201,0.25); }
        .feedback.incorrect { background: rgba(253,121,168,0.12); color: #fd79a8; border: 1px solid rgba(253,121,168,0.25); }
        .feedback .formula-reveal { font-weight: 400; font-size: 0.8rem; margin-top: 4px; color: var(--text2); }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
        /* Controls */
        .controls-row {
            display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
            padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .diff-btn {
            padding: 7px 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.10);
            background: var(--surface2); color: var(--text2); cursor: pointer;
            font-size: 0.8rem; font-weight: 600; transition: var(--transition);
            font-family: inherit; letter-spacing: 0.3px;
        }
        .diff-btn:hover { border-color: rgba(255,255,255,0.25); color: #fff; }
        .diff-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 10px rgba(108,92,231,0.32); }
        .toggle-formulas {
            margin-left: auto; font-size: 0.78rem; color: var(--accent2);
            cursor: pointer; font-weight: 600; background: none; border: none;
            font-family: inherit; transition: var(--transition); letter-spacing: 0.3px;
        }
        .toggle-formulas:hover { color: #c4bfff; }
        /* Formula Sheet */
        .formula-sheet {
            background: var(--surface); border-radius: 14px; padding: 16px 20px;
            display: none; border: 1px solid rgba(255,255,255,0.06);
            font-size: 0.8rem; line-height: 1.85; color: var(--text2);
        }
        .formula-sheet.open { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 0 24px; animation: fadeIn 0.3s ease; }
        .formula-sheet strong { color: #fff; }
        .formula-sheet .shape-block { break-inside: avoid; padding-bottom: 6px; }
        .formula-sheet .shape-name { color: var(--accent2); font-weight: 700; font-size: 0.82rem; display: block; margin-top: 6px; }
        .formula-sheet .var-legend { color: var(--text2); font-size: 0.72rem; font-style: italic; }
        /* Confetti */
        .confetti-container { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }
        .confetti-piece { position: absolute; width:10px; height:10px; border-radius:3px; animation: confettiFall 1.2s ease-out forwards; }
        @keyframes confettiFall {
            0%   { transform: translateY(-120px) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg) scale(0.3); opacity: 0; }
        }
        /* Responsive */
        @media (max-width: 860px) {
            .main-card { grid-template-columns: 1fr; }
            .card-left .canvas-wrapper { min-height: 260px; }
        }
        @media (max-width: 520px) {
            .app-container { padding: 12px 14px 16px; }
            .header h1 { font-size: 1.15rem; }
            .header { flex-direction: column; align-items: flex-start; }
            .main-card { padding: 14px; gap: 14px; }
            .input-row { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
            .problem-text { font-size: 0.95rem; }
            .controls-row { justify-content: center; }
            .toggle-formulas { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">&#128208;</div>
                <h1>Geometry Quest</h1>
            </div>
            <div class="stats-row">
                <div class="stat-pill score"><span>&#11088;</span> <span id="scoreVal">0</span></div>
                <div class="stat-pill streak"><span>&#128293;</span> <span id="streakVal">0</span></div>
                <div class="stat-pill total"><span>&#128221;</span> <span id="totalVal">0/0</span></div>
            </div>
        </div>

        <div class="main-card" id="mainCard">
            <div class="card-left">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="shapeCanvas" width="420" height="380"></canvas>
                    <span class="shape-label" id="shapeLabel">Shape</span>
                </div>
            </div>
            <div class="card-right">
                <div class="problem-area">
                    <span class="problem-type-badge badge-volume" id="problemBadge">Volume</span>
                    <p class="problem-text" id="problemText"></p>
                    <div class="challenge-note" id="challengeNote"></div>
                    <div class="dimensions-list" id="dimsList"></div>
                </div>
                <div>
                    <div class="input-row">
                        <input type="text" id="answerInput" placeholder="Enter your answer&#8230;" autocomplete="off">
                        <button class="btn btn-submit" id="submitBtn">&#10003; Check</button>
                    </div>
                    <div class="input-helper">
                        <button class="sym-btn" data-sym="&#8730;(" title="Square root">&#8730;(</button>
                        <button class="sym-btn" data-sym="&#960;" title="Pi (&#8776; 3.14159)">&#960;</button>
                        <button class="sym-btn" data-sym="&#178;" title="Squared">&#178;</button>
                        <button class="sym-btn" data-sym="&#179;" title="Cubed">&#179;</button>
                        <button class="sym-btn" data-sym="/" title="Fraction">/</button>
                        <span class="sym-hint">Supports: sqrt(), pi, sin/cos/tan(°), fractions like 3/4</span>
                    </div>
                </div>
                <div class="feedback" id="feedback"></div>
                <div class="controls-row">
                    <button class="diff-btn active" data-diff="easy">Easy</button>
                    <button class="diff-btn" data-diff="medium">Medium</button>
                    <button class="diff-btn" data-diff="hard">Hard</button>
                    <button class="btn btn-hint" id="hintBtn">&#128161; Hint</button>
                    <button class="btn btn-new" id="newBtn">&#128260; New</button>
                    <button class="toggle-formulas" id="toggleFormulas">&#128203; Formulas</button>
                </div>
            </div>
        </div>

        <div class="formula-sheet" id="formulaSheet"></div>
        <div class="confetti-container" id="confettiContainer"></div>
    </div>

    <script>
    (function () {
        'use strict';

        /* DOM */
        const canvas        = document.getElementById('shapeCanvas');
        const ctx           = canvas.getContext('2d');
        const shapeLabel    = document.getElementById('shapeLabel');
        const problemBadge  = document.getElementById('problemBadge');
        const problemText   = document.getElementById('problemText');
        const challengeNote = document.getElementById('challengeNote');
        const dimsList      = document.getElementById('dimsList');
        const answerInput   = document.getElementById('answerInput');
        const submitBtn     = document.getElementById('submitBtn');
        const feedbackDiv   = document.getElementById('feedback');
        const hintBtn       = document.getElementById('hintBtn');
        const newBtn        = document.getElementById('newBtn');
        const mainCard      = document.getElementById('mainCard');
        const formulaSheet  = document.getElementById('formulaSheet');
        const toggleFormulasBtn = document.getElementById('toggleFormulas');
        const confettiContainer = document.getElementById('confettiContainer');
        const scoreVal  = document.getElementById('scoreVal');
        const streakVal = document.getElementById('streakVal');
        const totalVal  = document.getElementById('totalVal');
        const diffBtns  = document.querySelectorAll('.diff-btn');
        const symBtns   = document.querySelectorAll('.sym-btn');

        /* State */
        let currentProblem = null;
        let score = 0, streak = 0, totalCorrect = 0, totalAttempts = 0;
        let difficulty = 'easy', hintUsed = false, answered = false;

        /* Full names for dimension abbreviations */
        const DIM_LABELS = {
            a: 'side', l: 'length', b: 'breadth', h: 'height',
            r: 'radius', R: 'base radius', d: 'diameter',
            D: 'base diameter', s: 'slant height',
            T: 'angle \u03b8 (\u00b0)', p: 'leg a', q: 'leg b',
            a1: 'top side', a2: 'bottom side', ht: 'trap. height',
        };

        /* Helpers */
        function randInt(mn, mx) { return Math.floor(Math.random() * (mx - mn + 1)) + mn; }
        function randDec()       { return Math.round(Math.random() * 9) / 10; }
        function roundTo(n, d)   { const f = Math.pow(10, d); return Math.round(n * f) / f; }
        function formatNum(n)    { return Number.isInteger(n) ? n.toString() : roundTo(n, 2).toString(); }

        function hexToRgb(hex) {
            const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return r ? [parseInt(r[1],16), parseInt(r[2],16), parseInt(r[3],16)] : [128,128,128];
        }

        /* Expression parser: sqrt(), pi, sin/cos/tan(degrees), fractions, ^ */
        function parseExpression(str) {
            var expr = str.trim();
            if (!expr) return NaN;
            expr = expr.replace(/\u221a\s*\(([^)]+)\)/g, 'Math.sqrt($1)');
            expr = expr.replace(/\u221a\s*(\d+(?:\.\d+)?)/g, 'Math.sqrt($1)');
            expr = expr.replace(/\bsqrt\s*\(([^)]*)\)/gi, 'Math.sqrt($1)');
            expr = expr.replace(/\u03c0/g, 'Math.PI');
            expr = expr.replace(/\bpi\b/gi, 'Math.PI');
            /* Trig in degrees — convert before ^ expansion */
            expr = expr.replace(/\bsin\s*\(([^)]*)\)/gi, function(m,a){ return 'Math.sin(('+a+')*Math.PI/180)'; });
            expr = expr.replace(/\bcos\s*\(([^)]*)\)/gi, function(m,a){ return 'Math.cos(('+a+')*Math.PI/180)'; });
            expr = expr.replace(/\btan\s*\(([^)]*)\)/gi, function(m,a){ return 'Math.tan(('+a+')*Math.PI/180)'; });
            expr = expr.replace(/\^/g, '**');
            expr = expr.replace(/\u00b2/g, '**2');
            expr = expr.replace(/\u00b3/g, '**3');
            // Safety: allow only digits/arithmetic after removing known Math tokens
            var cleaned = expr.replace(/\bMath\.(sqrt|PI|abs|pow|sin|cos|tan)\b/g, '').replace(/\*\*/g, '');
            if (/[^0-9+\-*/.()\s]/.test(cleaned)) return NaN;
            try {
                var result = new Function('"use strict"; return (' + expr + ')')();
                if (typeof result === 'number' && isFinite(result)) return result;
            } catch (e) { /* ignore */ }
            return NaN;
        }

        /* ================================================================
           POLYGON / FACTORY HELPERS
        ================================================================ */
        function regPolyArea(n, a)    { return (n * a * a) / (4 * Math.tan(Math.PI / n)); }
        function regPolyApothem(n, a) { return a / (2 * Math.tan(Math.PI / n)); }

        function makeRegPrism(n, name, icon, color) {
            return {
                name: name, icon: icon, color: color,
                dimNames: { a: 'base side', h: 'height' },
                applicable: ['LSA', 'TSA', 'Volume'],
                formulas: {
                    LSA:    String(n) + 'ah',
                    TSA:    String(n) + 'ah + 2A_base',
                    Volume: 'A_base \u00d7 h',
                },
                formulaDesc: {
                    LSA:    'LSA = ' + n + '\u00b7a\u00b7h  (' + n + ' rectangular faces)',
                    TSA:    'TSA = ' + n + '\u00b7a\u00b7h + 2A_base,  A_base = ' + n + 'a\u00b2 / [4 tan(\u03c0/' + n + ')]',
                    Volume: 'V = A_base \u00d7 h,  A_base = ' + n + 'a\u00b2 / [4 tan(\u03c0/' + n + ')]',
                },
                getDimensions: function(diff) {
                    var ranges = {easy:[2,5],medium:[2,7],hard:[2,10]};
                    var mn=ranges[diff][0], mx=ranges[diff][1];
                    var a=randInt(mn,mx), h=randInt(mn+1,mx+4);
                    if (diff==='hard' && Math.random()<0.35) a+=randDec();
                    if (diff==='hard' && Math.random()<0.35) h+=randDec();
                    return { a:roundTo(a,1), h:roundTo(h,1) };
                },
                compute: function(dims, type) {
                    var a=dims.a, h=dims.h, A=regPolyArea(n,a);
                    if (type==='LSA')    return n*a*h;
                    if (type==='TSA')    return 2*A+n*a*h;
                    if (type==='Volume') return A*h;
                },
                draw: function(dims) { drawRegularPrism(n, dims.a, dims.h, color); },
            };
        }

        function makeRegPyramid(n, name, icon, color) {
            return {
                name: name, icon: icon, color: color, pyramidN: n,
                dimNames: { a: 'base side', h: 'height' },
                applicable: ['LSA', 'TSA', 'Volume'],
                formulas: {
                    LSA:    '(\u00bd)' + n + 'al',
                    TSA:    '(\u00bd)' + n + 'al + A_base',
                    Volume: '(\u2153)A_base\u00b7h',
                },
                formulaDesc: {
                    LSA:    'LSA = (' + n + '\u00b7a\u00b7l)/2,  l = \u221a(h\u00b2 + apo\u00b2),  apo = a / [2 tan(\u03c0/' + n + ')]',
                    TSA:    'TSA = LSA + A_base,  A_base = ' + n + 'a\u00b2 / [4 tan(\u03c0/' + n + ')]',
                    Volume: 'V = (1/3)\u00b7A_base\u00b7h',
                },
                getDimensions: function(diff) {
                    var ranges = {easy:[2,6],medium:[3,9],hard:[2,12]};
                    var mn=ranges[diff][0], mx=ranges[diff][1];
                    var a=randInt(mn,mx), h=randInt(mn+1,mx+5);
                    if (diff==='hard' && Math.random()<0.35) a+=randDec();
                    if (diff==='hard' && Math.random()<0.35) h+=randDec();
                    return { a:roundTo(a,1), h:roundTo(h,1) };
                },
                compute: function(dims, type) {
                    var a=dims.a, h=dims.h;
                    var A=regPolyArea(n,a), apo=regPolyApothem(n,a);
                    var l=Math.sqrt(h*h+apo*apo);
                    if (type==='LSA')    return (n*a*l)/2;
                    if (type==='TSA')    return (n*a*l)/2+A;
                    if (type==='Volume') return (1/3)*A*h;
                },

            hexagonalPyramid:   makeRegPyramid(6,  'Hexagonal Pyramid',   '\uD83D\uDD3B', '#6c5ce7'),
            heptagonalPyramid:  makeRegPyramid(7,  'Heptagonal Pyramid',  '\uD83D\uDD3B', '#e17055'),
            octagonalPyramid:   makeRegPyramid(8,  'Octagonal Pyramid',   '\uD83D\uDD3B', '#0984e3'),
            nonagonalPyramid:   makeRegPyramid(9,  'Nonagonal Pyramid',   '\uD83D\uDD3B', '#a29bfe'),
            decagonalPyramid:   makeRegPyramid(10, 'Decagonal Pyramid',   '\uD83D\uDD3B', '#55efc4'),
        };

        /* ================================================================
           DISPLAY VARIANT — intentionally omit/transform info
        ================================================================ */
        function applyDisplayVariant(shapeKey, dims, problemType, diff) {
            var displayDims = Object.assign({}, dims);
            var shape = shapeDefs[shapeKey];

            if (diff === 'easy') return { displayDims: displayDims, challengeMsg: null, challengeSub: null };

            var roll = Math.random();
            var diamProb  = diff === 'hard' ? 0.55 : 0.35;
            var slantProb = diff === 'hard' ? 0.50 : 0.22;
            var trigProb  = diff === 'hard' ? 0.45 : 0.28;

            /* Diameter instead of radius */
            var radiusShapes = ['cylinder','cone','sphere','hemisphere'];
            if (radiusShapes.indexOf(shapeKey) !== -1 && roll < diamProb) {
                var nd = {};
                Object.keys(dims).forEach(function(k) {
                    nd[k === 'r' ? 'd' : k] = k === 'r' ? roundTo(dims[k]*2, 1) : dims[k];
                });
                return {
                    displayDims: nd,
                    challengeMsg: '\u26a0\ufe0f Diameter is given \u2014 find the radius first!',
                    challengeSub: 'radius r = d \u00f7 2',
                };
            }

            /* Frustum: diameters instead of radii */
            if (shapeKey === 'coneFrustum' && roll < diamProb) {
                var ndf = {};
                Object.keys(dims).forEach(function(k) {
                    if (k === 'R') ndf['D'] = roundTo(dims[k]*2, 1);
                    else if (k === 'r') ndf['d'] = roundTo(dims[k]*2, 1);
                    else ndf[k] = dims[k];
                });
                return {
                    displayDims: ndf,
                    challengeMsg: '\u26a0\ufe0f Diameters are given \u2014 find the radii first!',
                    challengeSub: 'base radius R = D \u00f7 2,  top radius r = d \u00f7 2',
                };
            }

            /* Cone: slant height instead of vertical height */
            if (shapeKey === 'cone' && roll >= diamProb && roll < diamProb + slantProb) {
                var r = dims.r, h = dims.h;
                var l = roundTo(Math.sqrt(r*r + h*h), 2);
                var isVol = (problemType === 'Volume');
                return {
                    displayDims: { r: dims.r, l: l },
                    challengeMsg: isVol
                        ? '\u26a1 Slant height l is given \u2014 derive height first!'
                        : '\u26a1 Slant height l is given directly \u2014 use it in the formula!',
                    challengeSub: isVol
                        ? 'h = \u221a(l\u00b2 \u2212 r\u00b2)'
                        : 'CSA = \u03c0rl  or  TSA = \u03c0r(r + l)',
                };
            }

            /* Cone: semi-vertical angle instead of height (hard only) */
            if (shapeKey === 'cone' && diff === 'hard' && roll >= diamProb + slantProb && roll < diamProb + slantProb + 0.30) {
                var rcone = dims.r, hcone = dims.h;
                var alpha = roundTo(Math.atan2(rcone, hcone) * 180 / Math.PI, 1);
                return {
                    displayDims: { r: rcone, T: alpha },
                    challengeMsg: '\uD83D\uDCD0 Semi-vertical angle \u03b8 is given \u2014 find height first!',
                    challengeSub: 'h = r / tan(\u03b8\u00b0)  \u2014 you may type tan(\u03b8) directly in your answer',
                };
            }

            /* Square Pyramid: slant height instead of vertical height */
            if (shapeKey === 'squarePyramid' && roll >= diamProb && roll < diamProb + slantProb) {
                var ap = dims.a, hp = dims.h;
                var lp = roundTo(Math.sqrt(hp*hp + (ap/2)*(ap/2)), 2);
                var isVolP = (problemType === 'Volume');
                return {
                    displayDims: { a: dims.a, l: lp },
                    challengeMsg: isVolP
                        ? '\u26a1 Slant height l is given \u2014 derive height first!'
                        : '\u26a1 Slant height l is given directly \u2014 use it in the formula!',
                    challengeSub: isVolP
                        ? 'h = \u221a(l\u00b2 \u2212 (a\u00f72)\u00b2)'
                        : 'LSA = 2al  or  TSA = a\u00b2 + 2al',
                };
            }

            /* Square Pyramid: slant angle instead of height (hard) */
            if (shapeKey === 'squarePyramid' && diff === 'hard' && roll >= diamProb + slantProb && roll < diamProb + slantProb + 0.35) {
                var asp = dims.a, hsp = dims.h, apoSp = asp / 2;
                var tsp = roundTo(Math.atan2(hsp, apoSp) * 180 / Math.PI, 1);
                return {
                    displayDims: { a: asp, T: tsp },
                    challengeMsg: '\uD83D\uDCCF Slant angle \u03b8 from base to lateral face is given \u2014 find height!',
                    challengeSub: 'h = (a/2) \u00d7 tan(\u03b8\u00b0)  \u2014 you may type tan(\u03b8) in your answer',
                };
            }

            /* Regular n-gon pyramid: slant angle instead of height (medium/hard) */
            if (shape && shape.pyramidN && roll >= diamProb && roll < diamProb + trigProb) {
                var n = shape.pyramidN;
                var apo = regPolyApothem(n, dims.a);
                var T = roundTo(Math.atan2(dims.h, apo) * 180 / Math.PI, 1);
                return {
                    displayDims: { a: dims.a, T: T },
                    challengeMsg: '\uD83D\uDCCF Slant angle \u03b8 (base to lateral face) is given \u2014 derive height!',
                    challengeSub: 'apothem = a / [2\u00b7tan(\u03c0/' + n + ')],  h = apothem \u00d7 tan(\u03b8\u00b0)',
                };
            }

            return { displayDims: displayDims, challengeMsg: null, challengeSub: null };
        }

        /* ================================================================
           PROBLEM GENERATION
        ================================================================ */
        function generateProblem() {
            var keys = Object.keys(shapeDefs);
            var shapeKey = keys[Math.floor(Math.random() * keys.length)];
            var shape = shapeDefs[shapeKey];
            var problemType = shape.applicable[Math.floor(Math.random() * shape.applicable.length)];
            var dims = shape.getDimensions(difficulty);
            var rawAnswer = shape.compute(dims, problemType);
            /* Rounding precision: easy=2dp, medium=2dp, hard=2 or 3dp */
            var rdp = (difficulty === 'hard' && Math.random() < 0.4) ? 3 : 2;
            var correctAnswer = roundTo(rawAnswer, rdp);
            var variant = applyDisplayVariant(shapeKey, dims, problemType, difficulty);
            return {
                shapeKey: shapeKey, shape: shape, problemType: problemType,
                dims: dims, displayDims: variant.displayDims,
                correctAnswer: correctAnswer, roundDecimal: rdp,
                challengeMsg: variant.challengeMsg, challengeSub: variant.challengeSub,
            };
        }

        function getProblemTypeLabel(pt) {
            return {LSA:'Lateral Surface Area',CSA:'Curved Surface Area',TSA:'Total Surface Area',Volume:'Volume'}[pt] || pt;
        }
        function getBadgeClass(pt) {
            if (pt==='LSA'||pt==='CSA') return 'badge-lsa';
            if (pt==='TSA') return 'badge-tsa';
            return 'badge-volume';
        }
        function getUnitSuffix(pt) { return pt==='Volume' ? 'cubic units' : 'square units'; }

        function buildProblemText(shape, displayDims, problemType, rdp) {
            var typeLabel = getProblemTypeLabel(problemType);
            var unitSuffix = getUnitSuffix(problemType);
            var entries = Object.keys(displayDims);
            var dimStr = entries.map(function(k) {
                var full = DIM_LABELS[k] || k;
                var dispKey = (k === 'T') ? '\u03b8' : k;
                var valStr = formatNum(displayDims[k]) + (k === 'T' ? '\u00b0' : '');
                return dispKey + ' (' + full + ') = <span class="dim">' + valStr + '</span>';
            }).join(', ');
            var plStr = rdp === 1 ? '1 decimal place' : rdp + ' decimal places';
            var roundNote = '  <em>Round to <strong>' + plStr + '</strong>.</em>';
            return 'Find the <strong>' + typeLabel + '</strong> of a <strong>' + shape.name +
                '</strong> where ' + dimStr + '.' + roundNote + ' <em>(in ' + unitSuffix + ')</em>';
        }

        /* ================================================================
           CANVAS
        ================================================================ */
        var W = 420, H = 380, cx = W/2, cy = H/2+10;

        function clearCanvas() {
            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,0.012)'; ctx.lineWidth = 0.5;
            for (var x=0; x<W; x+=20) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
            for (var y=0; y<H; y+=20) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
        }

        function drawFace(path, fill, stroke, lw) {
            stroke = stroke || 'rgba(255,255,255,0.5)'; lw = lw || 1.5;
            ctx.beginPath(); ctx.moveTo(path[0][0], path[0][1]);
            for (var i=1; i<path.length; i++) ctx.lineTo(path[i][0], path[i][1]);
            ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
            ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.lineJoin='round'; ctx.stroke();
        }

        function drawCube(a) {
            clearCanvas();
            var scale=Math.min(130/a,55), s=a*scale;
            var ox=cx-s*0.7, oy=cy+s*0.35, dx=s*0.85, dy=s*0.45, dz=s*0.9;
            drawFace([[ox,oy],[ox+dx,oy-dy],[ox+dx,oy-dy-dz],[ox,oy-dz]],'rgba(116,185,255,0.5)','rgba(255,255,255,0.7)',1.8);
            drawFace([[ox,oy-dz],[ox+dx,oy-dy-dz],[ox+dx+dx*0.15,oy-dy-dz-dy*0.4],[ox+dx*0.15,oy-dz-dy*0.4]],'rgba(160,210,255,0.65)','rgba(255,255,255,0.7)',1.8);
            drawFace([[ox+dx,oy-dy],[ox+dx+dx*0.15,oy-dy-dy*0.4],[ox+dx+dx*0.15,oy-dy-dz-dy*0.4],[ox+dx,oy-dy-dz]],'rgba(74,155,232,0.45)','rgba(255,255,255,0.7)',1.8);
            ctx.fillStyle='#fff'; ctx.font='bold 13px "Segoe UI",sans-serif'; ctx.textAlign='center';
            ctx.fillText('a (side) = '+formatNum(a), ox+dx*0.45, oy-dz-dy*0.35-8);
        }

        function drawCuboid(l,b,h) {
            clearCanvas();
            var scale=Math.min(100/Math.max(l,b,h),48);
            var sl=l*scale,sb=b*scale,sh=h*scale;
            var ox=cx-sl*0.55-sb*0.15, oy=cy+sh*0.2, dx=sl*0.9, dy=sb*0.5, dz=sh*0.85;
            drawFace([[ox,oy],[ox+dx,oy-dy*0.35],[ox+dx,oy-dy*0.35-dz],[ox,oy-dz]],'rgba(255,118,117,0.5)','rgba(255,255,255,0.7)',1.8);
            drawFace([[ox,oy-dz],[ox+dx,oy-dy*0.35-dz],[ox+dx+sb*0.4,oy-dy*0.35-dz-dy*0.55],[ox+sb*0.4,oy-dz-dy*0.55]],'rgba(255,168,167,0.6)','rgba(255,255,255,0.7)',1.8);
            drawFace([[ox+dx,oy-dy*0.35],[ox+dx+sb*0.4,oy-dy*0.35-dy*0.55],[ox+dx+sb*0.4,oy-dy*0.35-dz-dy*0.55],[ox+dx,oy-dy*0.35-dz]],'rgba(224,85,85,0.4)','rgba(255,255,255,0.7)',1.8);
            ctx.fillStyle='#fff'; ctx.font='bold 11px "Segoe UI",sans-serif'; ctx.textAlign='center';
            ctx.fillText('l (length)='+formatNum(l)+'  b (breadth)='+formatNum(b)+'  h (height)='+formatNum(h), cx, oy-dz-dy*0.6-6);
        }

        function drawCylinder(r,h,ld) {
            clearCanvas();
            var scale=Math.min(70/r,90/h), sr=r*scale, sh=h*scale;
            var tcx=cx, topY=cy-sh*0.45, botY=cy+sh*0.45, erx=sr, ery=sr*0.3;
            ctx.beginPath(); ctx.moveTo(tcx-erx,topY); ctx.lineTo(tcx-erx,botY);
            ctx.ellipse(tcx,botY,erx,ery,0,Math.PI,0,true); ctx.lineTo(tcx+erx,topY);
            ctx.ellipse(tcx,topY,erx,ery,0,Math.PI,0,false); ctx.closePath();
            ctx.fillStyle='rgba(85,239,196,0.35)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.8; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(tcx,topY,erx,ery,0,0,Math.PI*2);
            ctx.fillStyle='rgba(136,247,216,0.7)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.8; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(tcx,botY,erx,ery,0,0,Math.PI);
            ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1.4; ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle='#fff'; ctx.font='bold 12px "Segoe UI",sans-serif'; ctx.textAlign='center';
            var rLbl = (ld && 'd' in ld) ? 'd (diam.) = '+formatNum(ld.d) : 'r (radius) = '+formatNum(r);
            ctx.fillText(rLbl, tcx, topY-ery-12);
            ctx.fillText('h (height) = '+formatNum(h), tcx+erx+30, (topY+botY)/2);
            ctx.beginPath(); ctx.moveTo(tcx+erx+8,topY); ctx.lineTo(tcx+erx+8,botY);
            ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1; ctx.stroke();
        }

        function drawCone(r,h,ld) {
            clearCanvas();
            var scale=Math.min(68/r,100/h), sr=r*scale, sh=h*scale;
            var baseY=cy+sh*0.4, apexY=baseY-sh, tcx=cx, erx=sr, ery=sr*0.3;
            ctx.beginPath(); ctx.moveTo(tcx-erx,baseY);
            ctx.ellipse(tcx,baseY,erx,ery,0,Math.PI,0,true); ctx.lineTo(tcx,apexY); ctx.closePath();
            ctx.fillStyle='rgba(253,203,110,0.42)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.8; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(tcx,baseY,erx,ery,0,Math.PI,Math.PI*2);
            ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(255,255,255,0.38)'; ctx.lineWidth=1.4; ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.ellipse(tcx,baseY,erx,ery,0,0,Math.PI);
            ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.8; ctx.stroke();
            ctx.beginPath(); ctx.arc(tcx,apexY,3,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
            ctx.fillStyle='#fff'; ctx.font='bold 12px "Segoe UI",sans-serif'; ctx.textAlign='center';
            var rLbl = (ld && 'd' in ld) ? 'd (diam.) = '+formatNum(ld.d) : 'r (radius) = '+formatNum(r);
            var hLbl = (ld && 'l' in ld) ? 'l (slant) = '+formatNum(ld.l) : 'h (height) = '+formatNum(h);
            ctx.fillText(rLbl, tcx, baseY+ery+18);
            ctx.fillText(hLbl, tcx+erx+22, (apexY+baseY)/2);
            ctx.beginPath(); ctx.moveTo(tcx+erx+6,apexY); ctx.lineTo(tcx+erx+6,baseY);
            ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1; ctx.stroke();
        }

        function drawSphere(r, ld) {
            clearCanvas();
            var scale=Math.min(130/r,65), sr=r*scale, scx=cx, scy=cy;
            var grad=ctx.createRadialGradient(scx-sr*0.3,scy-sr*0.35,sr*0.1,scx,scy,sr);
            grad.addColorStop(0,'rgba(200,195,255,0.85)'); grad.addColorStop(0.6,'rgba(162,155,254,0.55)'); grad.addColorStop(1,'rgba(100,85,220,0.35)');
            ctx.beginPath(); ctx.arc(scx,scy,sr,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
            ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=2; ctx.stroke();
            for (var lat=-0.4; lat<=0.4; lat+=0.4) {
                var yo=lat*sr, rx=sr*Math.sqrt(1-lat*lat), ry=rx*0.3;
                ctx.beginPath(); ctx.ellipse(scx,scy+yo,rx,Math.abs(ry),0,0,Math.PI*2);
                ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; ctx.setLineDash([3,5]); ctx.stroke(); ctx.setLineDash([]);
            }
            ctx.fillStyle='#fff'; ctx.font='bold 13px "Segoe UI",sans-serif'; ctx.textAlign='center';
            var lbl = (ld && 'd' in ld) ? 'd (diam.) = '+formatNum(ld.d) : 'r (radius) = '+formatNum(r);
            ctx.fillText(lbl, scx, scy-sr-12);
            ctx.beginPath(); ctx.moveTo(scx,scy); ctx.lineTo(scx+sr*0.7,scy-sr*0.7);
            ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1.2; ctx.stroke();
        }

        function drawHemisphere(r, ld) {
            clearCanvas();
            var scale=Math.min(130/r,58), sr=r*scale, scx=cx, baseY=cy+sr*0.15;
            var erx=sr, ery=sr*0.28;
            ctx.beginPath(); ctx.ellipse(scx,baseY,erx,ery,0,Math.PI,0,true);
            ctx.arc(scx,baseY,sr,Math.PI,0,false); ctx.closePath();
            var grad=ctx.createRadialGradient(scx-sr*0.2,baseY-sr*0.5,sr*0.05,scx,baseY-sr*0.1,sr);
            grad.addColorStop(0,'rgba(255,179,204,0.8)'); grad.addColorStop(1,'rgba(253,121,168,0.4)');
            ctx.fillStyle=grad; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=2; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(scx,baseY,erx,ery,0,0,Math.PI*2);
            ctx.fillStyle='rgba(224,85,128,0.3)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.5; ctx.stroke();
            ctx.fillStyle='#fff'; ctx.font='bold 13px "Segoe UI",sans-serif'; ctx.textAlign='center';
            var lbl = (ld && 'd' in ld) ? 'd (diam.) = '+formatNum(ld.d) : 'r (radius) = '+formatNum(r);
            ctx.fillText(lbl, scx, baseY-sr-12);
        }

        function drawSquarePyramid(a,h,ld) {
            clearCanvas();
            var scale=Math.min(90/a,110/h), sa=a*scale, sh=h*scale;
            var ox=cx-sa*0.7, oy=cy+sa*0.3, dx=sa*0.9, dy=sa*0.45;
            var apexX=ox+dx*0.5, apexY=oy-dy*0.4-sh;
            var bl=[ox,oy], br=[ox+dx,oy-dy*0.3], tr=[ox+dx+sa*0.3,oy-dy*0.3-dy*0.7], tl=[ox+sa*0.3,oy-dy*0.7];
            drawFace([bl,br,[apexX,apexY]],'rgba(255,234,167,0.55)','rgba(255,255,255,0.7)',1.6);
            drawFace([br,tr,[apexX,apexY]],'rgba(212,184,74,0.45)','rgba(255,255,255,0.6)',1.6);
            drawFace([tr,tl,[apexX,apexY]],'rgba(200,170,60,0.28)','rgba(255,255,255,0.38)',1.3);
            drawFace([tl,bl,[apexX,apexY]],'rgba(240,215,130,0.38)','rgba(255,255,255,0.55)',1.6);
            ctx.beginPath(); ctx.moveTo(bl[0],bl[1]); ctx.lineTo(br[0],br[1]); ctx.lineTo(tr[0],tr[1]); ctx.lineTo(tl[0],tl[1]); ctx.closePath();
            ctx.fillStyle='rgba(180,150,80,0.22)'; ctx.fill(); ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,255,255,0.38)'; ctx.lineWidth=1.2; ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.moveTo(bl[0],bl[1]); ctx.lineTo(br[0],br[1]); ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.6; ctx.stroke();
            ctx.beginPath(); ctx.arc(apexX,apexY,3,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
            ctx.fillStyle='#fff'; ctx.font='bold 12px "Segoe UI",sans-serif'; ctx.textAlign='center';
            ctx.fillText('a (base side) = '+formatNum(a), ox+dx*0.5, oy+20);
            var hLbl = (ld && 'l' in ld) ? 'l (slant) = '+formatNum(ld.l) : 'h (height) = '+formatNum(h);
            ctx.fillText(hLbl, apexX+sa*0.5+14, (apexY+oy)/2);
        }

        function drawTriangularPrism(a,h) {
            clearCanvas();
            var scale=Math.min(75/a,85/h), sa=a*scale, sh=h*scale, triH=sa*Math.sqrt(3)/2;
            var ox=cx-sa*0.5, oy=cy+triH*0.3, depthX=sh*0.7, depthY=sh*0.35;
            var ftop=[ox+sa/2,oy-triH], fleft=[ox,oy], fright=[ox+sa,oy];
            var btop=[ftop[0]+depthX,ftop[1]-depthY], bleft=[fleft[0]+depthX,fleft[1]-depthY], bright=[fright[0]+depthX,fright[1]-depthY];
            drawFace([fleft,fright,ftop],'rgba(129,236,236,0.55)','rgba(255,255,255,0.7)',1.8);
            drawFace([ftop,btop,bright,fright],'rgba(181,247,247,0.48)','rgba(255,255,255,0.6)',1.5);
            drawFace([fright,bright,bleft,fleft],'rgba(78,207,207,0.38)','rgba(255,255,255,0.55)',1.5);
            ctx.beginPath(); ctx.moveTo(bleft[0],bleft[1]); ctx.lineTo(bright[0],bright[1]); ctx.lineTo(btop[0],btop[1]); ctx.closePath();
            ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,255,255,0.42)'; ctx.lineWidth=1.3; ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle='#fff'; ctx.font='bold 12px "Segoe UI",sans-serif'; ctx.textAlign='center';
            ctx.fillText('a (base side) = '+formatNum(a), ox+sa/2, oy+18);
            ctx.fillText('h (length) = '+formatNum(h), ox+sa+depthX+14, oy-triH*0.5);
        }

        function drawRegularPrism(n, a, h, color) {
            clearCanvas();
            var Rc = a/(2*Math.sin(Math.PI/n));
            var scale = Math.min(120/Rc, 90/h, 2);
            var sR=Rc*scale, sh=h*scale*0.8;
            var pcx=cx-sh*0.22, pcy=cy+sR*0.08;
            var depthX=sh*0.62, depthY=sh*0.32;
            var rot = -Math.PI/2 + (n%2===0 ? Math.PI/n : 0);
            var fv=[], bv=[];
            for (var i=0; i<n; i++) {
                var ang = rot + (2*Math.PI*i/n);
                fv.push([pcx+sR*Math.cos(ang), pcy+sR*Math.sin(ang)]);
            }
            fv.forEach(function(p) { bv.push([p[0]+depthX, p[1]-depthY]); });
            var rgb = hexToRgb(color);
            var cr=rgb[0], cg=rgb[1], cb=rgb[2];
            ctx.beginPath(); ctx.moveTo(bv[0][0],bv[0][1]);
            for (var bi=1; bi<n; bi++) ctx.lineTo(bv[bi][0],bv[bi][1]);
            ctx.closePath(); ctx.fillStyle='rgba('+cr+','+cg+','+cb+',0.12)'; ctx.fill();
            ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1.1; ctx.stroke(); ctx.setLineDash([]);
            for (var si=0; si<n; si++) {
                var sj=(si+1)%n;
                var mx=(fv[si][0]+fv[sj][0])/2-pcx, my=(fv[si][1]+fv[sj][1])/2-pcy;
                if (mx+my*0.3 > -sR*0.15) {
                    var shade=Math.max(0.18,Math.min(0.55,0.36+(mx/sR)*0.2));
                    drawFace([fv[si],fv[sj],bv[sj],bv[si]],'rgba('+cr+','+cg+','+cb+','+shade+')','rgba(255,255,255,0.48)',1.3);
                }
            }
            ctx.beginPath(); ctx.moveTo(fv[0][0],fv[0][1]);
            for (var fi=1; fi<n; fi++) ctx.lineTo(fv[fi][0],fv[fi][1]);
            ctx.closePath(); ctx.fillStyle='rgba('+cr+','+cg+','+cb+',0.55)'; ctx.fill();
            ctx.strokeStyle='rgba(255,255,255,0.72)'; ctx.lineWidth=1.8; ctx.stroke();
            var btmY=Math.max.apply(null, fv.map(function(v){return v[1];}));
            ctx.fillStyle='#fff'; ctx.font='bold 12px "Segoe UI",sans-serif'; ctx.textAlign='center';
            ctx.fillText('a (base side) = '+formatNum(a), pcx, Math.min(btmY+20,H-10));
            ctx.fillText('h (height) = '+formatNum(h), pcx+depthX*0.55, pcy-sR-10);
        }

        function drawFrustum(R,r,h,ld) {
            clearCanvas();
            var scale=Math.min(75/R,95/h), sR=R*scale, sr=r*scale, sh=h*scale*0.85;
            var tcx=cx, botY=cy+sh*0.45, topY=botY-sh;
            var erbx=sR,erby=sR*0.28, ertx=sr,erty=sr*0.28;
            ctx.beginPath(); ctx.moveTo(tcx-erbx,botY); ctx.lineTo(tcx-ertx,topY);
            ctx.ellipse(tcx,topY,ertx,erty,0,Math.PI,0,true); ctx.lineTo(tcx+erbx,botY);
            ctx.ellipse(tcx,botY,erbx,erby,0,0,Math.PI,false); ctx.closePath();
            ctx.fillStyle='rgba(232,67,147,0.35)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.8; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(tcx,topY,ertx,erty,0,0,Math.PI*2);
            ctx.fillStyle='rgba(255,150,210,0.6)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.8; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(tcx,botY,erbx,erby,0,0,Math.PI);
            ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.8; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(tcx,botY,erbx,erby,0,Math.PI,Math.PI*2);
            ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,255,255,0.38)'; ctx.lineWidth=1.3; ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle='#fff'; ctx.font='bold 12px "Segoe UI",sans-serif'; ctx.textAlign='center';
            var RLbl=(ld&&'D'in ld)?'D (base diam.) = '+formatNum(ld.D):'R (base rad.) = '+formatNum(R);
            var rLbl=(ld&&'d'in ld)?'d (top diam.) = '+formatNum(ld.d):'r (top rad.) = '+formatNum(r);
            ctx.fillText(RLbl, tcx, botY+erby+18);
            ctx.fillText(rLbl, tcx, topY-erty-12);
            ctx.fillText('h (height) = '+formatNum(h), tcx+Math.max(erbx,ertx)+30, (topY+botY)/2);
            ctx.beginPath(); ctx.moveTo(tcx+erbx+10,botY); ctx.lineTo(tcx+erbx+10,topY);
            ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1; ctx.stroke();
        }

        /* ---- drawRegularPyramid: general regular n-gon pyramid ---- */
        function drawRegularPyramid(n, a, h, color, ld) {
            clearCanvas();
            var Rc = a / (2 * Math.sin(Math.PI / n));
            var scale = Math.min(110/Rc, 90/h, 2.5);
            var sR = Rc * scale, sh = h * scale * 0.75;
            var rot = -Math.PI/2 + (n % 2 === 0 ? Math.PI/n : 0);
            var pcx = cx - sh * 0.18, pcy = cy + sR * 0.12 + sh * 0.2;
            var bv = [];
            for (var i = 0; i < n; i++) {
                var ang = rot + 2 * Math.PI * i / n;
                bv.push([pcx + sR * Math.cos(ang), pcy + sR * Math.sin(ang)]);
            }
            var apexX = pcx + sh * 0.25, apexY = pcy - sh;
            var rgb = hexToRgb(color);
            var cr = rgb[0], cg = rgb[1], cb = rgb[2];
            /* base (dashed) */
            ctx.beginPath(); ctx.moveTo(bv[0][0], bv[0][1]);
            for (var bi = 1; bi < n; bi++) ctx.lineTo(bv[bi][0], bv[bi][1]);
            ctx.closePath();
            ctx.fillStyle = 'rgba('+cr+','+cg+','+cb+',0.18)'; ctx.fill();
            ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.2; ctx.stroke(); ctx.setLineDash([]);
            /* lateral faces */
            for (var si = 0; si < n; si++) {
                var sj = (si+1) % n;
                var mx = (bv[si][0]+bv[sj][0])/2 - pcx;
                if (mx > -sR * 0.1) {
                    var shade = Math.max(0.2, Math.min(0.55, 0.38+(mx/sR)*0.2));
                    drawFace([bv[si],bv[sj],[apexX,apexY]],'rgba('+cr+','+cg+','+cb+','+shade+')','rgba(255,255,255,0.5)',1.4);
                }
            }
            ctx.beginPath(); ctx.arc(apexX, apexY, 3, 0, Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
            ctx.fillStyle='#fff'; ctx.font='bold 12px "Segoe UI",sans-serif'; ctx.textAlign='center';
            ctx.fillText('a (base side) = '+formatNum(a), pcx, pcy + sR + 18);
            var hLbl = (ld && 'T' in ld) ? '\u03b8 (slant angle) = '+formatNum(ld.T)+'\u00b0' : 'h (height) = '+formatNum(h);
            ctx.fillText(hLbl, apexX + sR + 18, (apexY + pcy) / 2);
        }

        /* ---- drawRectPyramid: rectangular base pyramid ---- */
        function drawRectPyramid(l, b, h, ld) {
            clearCanvas();
            var scale = Math.min(90/Math.max(l,b), 110/h, 2.5);
            var sl=l*scale, sb=b*scale, sh=h*scale;
            var ox=cx-sl*0.5-sb*0.15, oy=cy+sh*0.2;
            var dx=sl, dy=sb*0.45;
            var bl=[ox,oy], br=[ox+dx,oy], tr=[ox+dx+sb*0.3,oy-dy], tl=[ox+sb*0.3,oy-dy];
            var apexX=(bl[0]+tr[0])/2, apexY=oy-dy*0.5-sh;
            drawFace([bl,br,[apexX,apexY]],'rgba(250,177,160,0.5)','rgba(255,255,255,0.7)',1.5);
            drawFace([br,tr,[apexX,apexY]],'rgba(220,140,120,0.45)','rgba(255,255,255,0.65)',1.5);
            drawFace([tr,tl,[apexX,apexY]],'rgba(200,120,100,0.28)','rgba(255,255,255,0.38)',1.2);
            drawFace([tl,bl,[apexX,apexY]],'rgba(235,160,140,0.38)','rgba(255,255,255,0.55)',1.5);
            ctx.beginPath(); ctx.moveTo(bl[0],bl[1]); ctx.lineTo(br[0],br[1]); ctx.lineTo(tr[0],tr[1]); ctx.lineTo(tl[0],tl[1]); ctx.closePath();
            ctx.fillStyle='rgba(180,100,80,0.15)'; ctx.fill();
            ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.2; ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.arc(apexX,apexY,3,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
            ctx.fillStyle='#fff'; ctx.font='bold 11px "Segoe UI",sans-serif'; ctx.textAlign='center';
            ctx.fillText('l='+formatNum(l)+'  b='+formatNum(b), ox+sl/2, oy+18);
            var hLbl2 = (ld && 'T' in ld) ? '\u03b8='+formatNum(ld.T)+'\u00b0' : 'h='+formatNum(h);
            ctx.fillText(hLbl2, apexX+sl*0.4+20, (apexY+oy)/2);
        }

        /* ---- drawTrapezoidPrism: isosceles-trapezoid cross-section ---- */
        function drawTrapezoidPrism(a1, a2, ht, h) {
            clearCanvas();
            var scale = Math.min(80/Math.max(a2,h), 100/ht, 2.5);
            var sa1=a1*scale, sa2=a2*scale, sht=ht*scale, sh=h*scale*0.7;
            var off=(sa2-sa1)/2;
            var ox=cx-sa2*0.4-sh*0.15, oy=cy+sht*0.3;
            var depthX=sh*0.62, depthY=sh*0.28;
            var fbl=[ox,oy], fbr=[ox+sa2,oy], ftr=[ox+sa2-off,oy-sht], ftl=[ox+off,oy-sht];
            var bbl=[fbl[0]+depthX,fbl[1]-depthY], bbr=[fbr[0]+depthX,fbr[1]-depthY];
            var btr=[ftr[0]+depthX,ftr[1]-depthY], btl=[ftl[0]+depthX,ftl[1]-depthY];
            ctx.beginPath(); ctx.moveTo(bbl[0],bbl[1]); ctx.lineTo(bbr[0],bbr[1]); ctx.lineTo(btr[0],btr[1]); ctx.lineTo(btl[0],btl[1]); ctx.closePath();
            ctx.fillStyle='rgba(253,121,168,0.1)'; ctx.fill();
            ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1.1; ctx.stroke(); ctx.setLineDash([]);
            drawFace([fbl,fbr,bbr,bbl],'rgba(253,121,168,0.4)','rgba(255,255,255,0.55)',1.4);
            drawFace([fbr,ftr,btr,bbr],'rgba(253,100,150,0.35)','rgba(255,255,255,0.5)',1.3);
            drawFace([ftr,ftl,btl,btr],'rgba(253,150,180,0.45)','rgba(255,255,255,0.6)',1.4);
            drawFace([fbl,fbr,ftr,ftl],'rgba(253,121,168,0.55)','rgba(255,255,255,0.75)',1.8);
            ctx.fillStyle='#fff'; ctx.font='bold 11px "Segoe UI",sans-serif'; ctx.textAlign='center';
            ctx.fillText('a1='+formatNum(a1)+'  a2='+formatNum(a2)+'  ht='+formatNum(ht), ox+sa2/2, oy+18);
            ctx.fillText('h (length)='+formatNum(h), ox+sa2+depthX+16, oy-sht*0.5);
        }

        /* ---- drawRightTrianglePrism: right-angle triangle cross-section ---- */
        function drawRightTrianglePrism(p, q, h) {
            clearCanvas();
            var scale = Math.min(80/Math.max(p,q), 80/h, 2.5);
            var sp=p*scale, sq=q*scale, sh=h*scale*0.7;
            var ox=cx-sp*0.4-sh*0.15, oy=cy+sq*0.2;
            var depthX=sh*0.62, depthY=sh*0.28;
            var fa=[ox,oy], fb=[ox+sp,oy], fc=[ox,oy-sq];
            var ba=[fa[0]+depthX,fa[1]-depthY], bb=[fb[0]+depthX,fb[1]-depthY], bc=[fc[0]+depthX,fc[1]-depthY];
            ctx.beginPath(); ctx.moveTo(ba[0],ba[1]); ctx.lineTo(bb[0],bb[1]); ctx.lineTo(bc[0],bc[1]); ctx.closePath();
            ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,255,255,0.32)'; ctx.lineWidth=1.1; ctx.stroke(); ctx.setLineDash([]);
            drawFace([fa,fb,bb,ba],'rgba(116,185,255,0.38)','rgba(255,255,255,0.55)',1.4);
            drawFace([fb,fc,bc,bb],'rgba(100,165,245,0.32)','rgba(255,255,255,0.5)',1.3);
            drawFace([fa,fb,fc],'rgba(116,185,255,0.55)','rgba(255,255,255,0.75)',1.8);
            ctx.fillStyle='#fff'; ctx.font='bold 12px "Segoe UI",sans-serif'; ctx.textAlign='center';
            ctx.fillText('p='+formatNum(p)+'  q='+formatNum(q), ox+sp/2, oy+18);
            ctx.fillText('h (length)='+formatNum(h), ox+sp+depthX+16, oy-sq*0.5);
        }
        function renderProblem(problem) {
            shapeLabel.textContent = problem.shape.name;
            problemBadge.textContent = getProblemTypeLabel(problem.problemType);
            problemBadge.className = 'problem-type-badge ' + getBadgeClass(problem.problemType);
            problemText.innerHTML = buildProblemText(problem.shape, problem.displayDims, problem.problemType, problem.roundDecimal);

            if (problem.challengeMsg) {
                var trigNote = ('T' in problem.displayDims)
                    ? '<div class="derive-hint">\uD83D\uDCA1 You may type <em>sin(°)/cos(°)/tan(°)</em> directly in your answer.</div>'
                    : '';
                challengeNote.innerHTML = problem.challengeMsg +
                    (problem.challengeSub ? '<div class="derive-hint">' + problem.challengeSub + '</div>' : '') +
                    trigNote;
                challengeNote.classList.add('show');
            } else {
                challengeNote.classList.remove('show');
                challengeNote.innerHTML = '';
            }

            dimsList.innerHTML = '';
            Object.keys(problem.displayDims).forEach(function(key) {
                var val = problem.displayDims[key];
                var tag = document.createElement('span');
                tag.className = 'dim-tag';
                var full = DIM_LABELS[key] || key;
                var dispKey = (key === 'T') ? '\u03b8' : key;
                var valFmt = formatNum(val) + (key === 'T' ? '\u00b0' : '');
                tag.innerHTML = '<strong>' + dispKey + '</strong> <span class="dim-name">(' + full + ')</span> = ' + valFmt;
                dimsList.appendChild(tag);
            });

            problem.shape.draw(problem.dims, problem.displayDims);
            answerInput.value = ''; answerInput.focus();
            feedbackDiv.className = 'feedback'; feedbackDiv.textContent = ''; feedbackDiv.style.display = 'none';
            mainCard.classList.remove('correct-flash','incorrect-flash');
            answered = false; hintUsed = false;
            submitBtn.disabled = false; submitBtn.textContent = '\u2713 Check';
        }

        function updateStats() {
            scoreVal.textContent = score;
            streakVal.textContent = streak;
            totalVal.textContent = totalCorrect+'/'+totalAttempts;
        }

        function showFeedback(correct, problem) {
            feedbackDiv.style.display = 'block';
            feedbackDiv.className = 'feedback show '+(correct?'correct':'incorrect');
            var fd = problem.shape.formulaDesc[problem.problemType] || '';
            var unit = getUnitSuffix(problem.problemType);
            var rdp = problem.roundDecimal || 2;
            var ansStr = problem.correctAnswer.toFixed(rdp);
            if (correct) {
                feedbackDiv.innerHTML = '\u2705 <strong>Correct!</strong> The answer is <strong>'+ansStr+'</strong> '+unit+'.<div class="formula-reveal">\uD83D\uDCDD '+fd+'</div>';
                mainCard.classList.add('correct-flash');
                setTimeout(function(){ mainCard.classList.remove('correct-flash'); }, 600);
                spawnConfetti();
            } else {
                feedbackDiv.innerHTML = '\u274C <strong>Not quite.</strong> The correct answer is <strong>'+ansStr+'</strong> '+unit+'.<div class="formula-reveal">\uD83D\uDCDD '+fd+'</div>';
                mainCard.classList.add('incorrect-flash');
                setTimeout(function(){ mainCard.classList.remove('incorrect-flash'); }, 600);
            }
            submitBtn.disabled = true; submitBtn.textContent = '\u2713 Checked';
        }

        function spawnConfetti() {
            var colors=['#6c5ce7','#00cec9','#fdcb6e','#fd79a8','#55efc4','#74b9ff','#ffeaa7','#a29bfe'];
            var frag=document.createDocumentFragment();
            for (var i=0; i<55; i++) {
                var p=document.createElement('div');
                p.className='confetti-piece';
                p.style.cssText='left:'+Math.random()*100+'%;top:'+(-(Math.random()*80+20))+'px;background-color:'+colors[Math.floor(Math.random()*colors.length)]+';animation-duration:'+(Math.random()*1+0.8)+'s;animation-delay:'+(Math.random()*0.3)+'s;width:'+(Math.random()*8+5)+'px;height:'+(Math.random()*8+5)+'px;border-radius:'+(Math.random()>0.5?'50%':'2px');
                frag.appendChild(p);
            }
            confettiContainer.appendChild(frag);
            setTimeout(function(){ confettiContainer.innerHTML=''; }, 1900);
        }

        function buildFormulaSheet() {
            var html='';
            Object.keys(shapeDefs).forEach(function(key) {
                var shape=shapeDefs[key];
                html+='<div class="shape-block"><span class="shape-name">'+shape.icon+' '+shape.name+'</span>';
                Object.keys(shape.formulas).forEach(function(pt) {
                    html+=getProblemTypeLabel(pt)+': <strong>'+shape.formulas[pt]+'</strong><br>';
                });
                if (shape.dimNames) {
                    var legend=Object.keys(shape.dimNames).map(function(k){ return k+'='+shape.dimNames[k]; }).join(', ');
                    html+='<span class="var-legend">'+legend+'</span>';
                }
                html+='</div>';
            });
            formulaSheet.innerHTML=html;
        }

        /* ================================================================
           EVENTS
        ================================================================ */
        function handleSubmit() {
            if (answered || !currentProblem) return;
            var userInput = answerInput.value.trim();
            if (!userInput) return;
            var userNum = parseExpression(userInput);
            if (isNaN(userNum)) {
                feedbackDiv.style.display='block'; feedbackDiv.className='feedback show incorrect';
                feedbackDiv.innerHTML='\u26a0\ufe0f Could not parse. Try a number, sqrt(\u2026), pi, sin/cos/tan(\u2026°), or fractions like 3/4.';
                return;
            }
            totalAttempts++;
            /* Tolerance = half a unit in the last decimal place asked */
            var rdp = currentProblem.roundDecimal || 2;
            var tol = 0.5 * Math.pow(10, -rdp);
            var correct = Math.abs(userNum - currentProblem.correctAnswer) <= tol;
            if (correct) { totalCorrect++; score += hintUsed?1:2; streak++; }
            else         { streak=0; score=Math.max(0,score-1); }
            answered=true;
            updateStats();
            showFeedback(correct, currentProblem);
        }

        function handleNewProblem() {
            currentProblem = generateProblem();
            renderProblem(currentProblem);
            updateStats();
        }

        function handleHint() {
            if (answered || !currentProblem) return;
            hintUsed=true;
            var fd = currentProblem.shape.formulaDesc[currentProblem.problemType] || '';
            feedbackDiv.style.display='block'; feedbackDiv.className='feedback show';
            feedbackDiv.style.background='rgba(253,203,110,0.1)';
            feedbackDiv.style.color='#fdcb6e';
            feedbackDiv.style.border='1px solid rgba(253,203,110,0.25)';
            feedbackDiv.innerHTML='\uD83D\uDCA1 <strong>Hint:</strong> '+fd;
            setTimeout(function(){
                if (!answered && feedbackDiv.style.color==='#fdcb6e') {
                    feedbackDiv.style.display='none'; feedbackDiv.className='feedback';
                }
            }, 4000);
        }

        /* ================================================================
           INIT
        ================================================================ */
        function init() {
            buildFormulaSheet();

            diffBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    diffBtns.forEach(function(b){ b.classList.remove('active'); });
                    btn.classList.add('active');
                    difficulty = btn.dataset.diff;
                    handleNewProblem();
                });
            });

            submitBtn.addEventListener('click', handleSubmit);
            answerInput.addEventListener('keydown', function(e){ if(e.key==='Enter') handleSubmit(); });
            newBtn.addEventListener('click', handleNewProblem);
            hintBtn.addEventListener('click', handleHint);

            symBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var sym = btn.dataset.sym;
                    var inp = answerInput;
                    var selStart = inp.selectionStart, selEnd = inp.selectionEnd;
                    inp.value = inp.value.substring(0, selStart) + sym + inp.value.substring(selEnd);
                    var pos = selStart + sym.length;
                    inp.setSelectionRange(pos, pos);
                    inp.focus();
                });
            });

            toggleFormulasBtn.addEventListener('click', function() {
                formulaSheet.classList.toggle('open');
                toggleFormulasBtn.textContent = formulaSheet.classList.contains('open') ? '\uD83D\uDCCB Hide Formulas' : '\uD83D\uDCCB Formulas';
            });

            handleNewProblem();
            updateStats();
        }

        init();
    })();
    </script>
